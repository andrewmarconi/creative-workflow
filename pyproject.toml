[project]
name = "queerchaos-2"
version = "0.1.0"
description = "Batch image generation using Flux2 diffusion models, optimized for Apple Silicon"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "celery>=5.6.2",
    "diffusers>=0.36.0",
    "diffusion>=6.12.1",
    "django>=6.0.1",
    "django-extensions>=4.1",
    "django-jazzmin>=3.0.0",
    "django-unfold>=0.77.1",
    "flower>=2.0.1",
    "gradio>=6.5.1",
    "huggingface-hub>=1.3.5",
    "peft>=0.18.1",
    "pillow>=12.1.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "rq>=2.1.0",
    "safetensors>=0.7.0",
    "stringcase>=1.2.0",
    "torch>=2.10.0",
    "tqdm>=4.67.2",
    "transformers>=5.0.0",
    "werkzeug>=3.1.5",
]
