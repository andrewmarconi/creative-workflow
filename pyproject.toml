[project]
name = "creative-workflow"
version = "0.1.0"
description = "Batch image generation using Flux2 diffusion models, optimized for Apple Silicon"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.45.0",
    "celery>=5.6.2",
    "compel>=2.0.0",
    "diffusers>=0.36.0",
    "diffusion>=6.12.1",
    "django>=6.0.1",
    "django-celery-results>=2.6.0",
    "django-extensions>=4.1",
    "django-unfold>=0.77.1",
    "gradio>=6.5.1",
    "huggingface-hub>=0.23.2,<1.0",
    "opentelemetry-api>=1.31.0",
    "opentelemetry-sdk>=1.31.0",
    "opentelemetry-instrumentation-django>=0.51b0",
    "opentelemetry-instrumentation-celery>=0.51b0",
    "opentelemetry-instrumentation-redis>=0.51b0",
    "opentelemetry-instrumentation-logging>=0.51b0",
    "opentelemetry-exporter-otlp>=1.31.0",
    "peft>=0.18.1",
    "pillow>=12.1.0",
    "psycopg[binary]>=3.2.0",
    "python-json-logger>=3.2.1",
    "redis>=5.0.0",
    "rq>=2.1.0",
    "safetensors>=0.7.0",
    "stringcase>=1.2.0",
    "torch>=2.10.0",
    "tqdm>=4.67.2",
    "transformers~=4.45",
    "werkzeug>=3.1.5",
    "outlines>=1.2.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "honcho>=2.0.0",
]
