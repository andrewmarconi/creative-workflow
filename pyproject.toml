[project]
name = "generative-creative-lab"
version = "0.1.0"
description = "Django + Celery application for multi-model diffusion image generation"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.45.0",
    "celery>=5.6.2",
    "compel>=2.0.0",
    "diffusers>=0.36.0",
    "django>=6.0.1",
    "django-celery-results>=2.6.0",
    "django-extensions>=4.1",
    "django-unfold>=0.77.1",
    "huggingface-hub>=0.23.2,<1.0",
    "jinja2>=3.1.0",
    "outlines>=1.2.9",
    "pillow>=12.1.0",
    "psycopg[binary]>=3.2.0",
    "python-json-logger>=3.2.1",
    "redis>=5.0.0",
    "safetensors>=0.7.0",
    "torch>=2.10.0",
    "transformers~=4.45",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "honcho>=2.0.0",
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=4.0",
    "sphinxcontrib-mermaid>=2.0.0",
    "flake8>=7.3.0",
]
