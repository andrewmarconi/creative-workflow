[project]
name = "generative-creative-lab"
version = "0.1.0"
description = "Django + Celery application for multi-model diffusion image generation"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "av>=11.0.0",
    "bitsandbytes>=0.45.0",
    "celery>=5.6.2",
    "compel>=2.0.0",
    "diffusers>=0.36.0",
    "django>=6.0.1",
    "django-celery-results>=2.6.0",
    "django-extensions>=4.1",
    "django-unfold>=0.78.1",
    "huggingface-hub>=0.23.2,<1.0",
    "jinja2>=3.1.0",
    "langgraph>=0.2",
    "librosa>=0.10.0",
    "openai-whisper>=20231117",
    "opencv-python>=4.8.0",
    "outlines>=1.2.9",
    "pillow>=12.1.0",
    "protobuf>=6.33.5",
    "psycopg[binary]>=3.2.0",
    "python-json-logger>=3.2.1",
    "python-magic>=0.4.27",
    "redis>=5.0.0",
    "safetensors>=0.7.0",
    "scenedetect[opencv]>=0.6.2",
    "sentencepiece>=0.2.0",
    "torch>=2.10.0",
    "transformers~=4.45",
    "ultralytics>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "flower>=2.0.0",
    "honcho>=2.0.0",
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=4.0",
    "sphinxcontrib-mermaid>=2.0.0",
    "sphinx-jinja>=2.0.0",
    "flake8>=7.3.0",
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "coverage[toml]>=7.4.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cw.settings"
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Tests", "*TestCase"]
python_functions = ["test_*"]
testpaths = ["src/cw"]
addopts = [
    "--reuse-db",
    "--strict-markers",
    "--tb=short",
    "-v",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src/cw"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/manage.py",
    "*/settings.py",
    "*/wsgi.py",
    "*/asgi.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
