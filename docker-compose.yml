services:
  postgres:
    image: postgres:17
    container_name: cw_postgres
    environment:
      POSTGRES_DB: cw
      POSTGRES_USER: cw
      POSTGRES_PASSWORD: cw_dev
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cw"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:latest
    container_name: cw_valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Jaeger - All-in-one (tracing UI)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: cw_jaeger
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "16686:16686" # Jaeger UI
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  postgres_data:
  valkey_data:
