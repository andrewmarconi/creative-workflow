services:
  postgres:
    image: postgres:17
    container_name: cw_postgres
    environment:
      POSTGRES_DB: cw
      POSTGRES_USER: cw
      POSTGRES_PASSWORD: cw_dev
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cw"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:latest
    container_name: cw_valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Loki - Log aggregation
  loki:
    image: grafana/loki:latest
    container_name: cw_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki

  # Alloy - Unified observability collector (ships logs to Loki)
  # Replaces Promtail (EOL March 2026)
  alloy:
    image: grafana/alloy:latest
    container_name: cw_alloy
    volumes:
      - ./logs:/logs:ro
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    depends_on:
      - loki

  # Grafana - Log viewing UI
  grafana:
    image: grafana/grafana:latest
    container_name: cw_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki

volumes:
  postgres_data:
  valkey_data:
  loki_data:
  grafana_data:
