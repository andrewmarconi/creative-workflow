server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Django logs
  - job_name: django
    static_configs:
      - targets:
          - localhost
        labels:
          job: django
          __path__: /logs/django.log

  # Celery worker logs
  - job_name: celery
    static_configs:
      - targets:
          - localhost
        labels:
          job: celery
          __path__: /logs/celery.log

  # Task execution logs
  - job_name: tasks
    static_configs:
      - targets:
          - localhost
        labels:
          job: tasks
          __path__: /logs/tasks.log

  # All JSON logs (with JSON parsing)
  - job_name: json_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: json_logs
          __path__: /logs/*.log
    pipeline_stages:
      - json:
          expressions:
            level: levelname
            logger: name
            message: message
            timestamp: asctime
      - labels:
          level:
          logger:
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05,000"
